name: Prospekt Collector

on:
  workflow_dispatch:
  schedule:
    # Her Pazartesi 09:07 UTC = 12:07 Türkiye saati (TR yıl boyu UTC+3, DST yok)
    # Not: dakika 00 yerine 07 seçildi - GitHub Actions saat başlarında yoğun olduğu için
    # tam saat başına denk gelen scheduled run'lar sessizce atlanabiliyor.
    - cron: "7 9 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run collector
        run: python collector.py

      - name: Upload PDFs to Google Drive
        if: always()
        env:
          GDRIVE_OAUTH_CLIENT_ID: ${{ secrets.GDRIVE_OAUTH_CLIENT_ID }}
          GDRIVE_OAUTH_CLIENT_SECRET: ${{ secrets.GDRIVE_OAUTH_CLIENT_SECRET }}
          GDRIVE_OAUTH_REFRESH_TOKEN: ${{ secrets.GDRIVE_OAUTH_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python upload_to_drive.py

      - name: Send report email
        if: always()
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: python send_report.py

      - name: Commit and push manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f FINAL_PROSPEKTE/collector_manifest_v16.json ]; then
            git add FINAL_PROSPEKTE/collector_manifest_v16.json
          fi
          if git diff --cached --quiet; then
            echo "Manifest değişmedi, commit atlanıyor."
          else
            git commit -m "Manifest güncellemesi - $(date -u +'%Y-%m-%d')"
            git push
          fi
