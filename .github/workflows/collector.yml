name: Prospekt Collector

on:
  workflow_dispatch:
  schedule:
    # Her Pazartesi 09:00 UTC = 12:00 Türkiye saati (TR yıl boyu UTC+3, DST yok)
    - cron: "0 9 * * 1"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run collector
        run: python collector.py

      - name: Upload PDFs to Google Drive
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python upload_to_drive.py

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FINAL_PROSPEKTE/collector_manifest_v16.json
          if git diff --cached --quiet; then
            echo "Manifest değişmedi, commit atlanıyor."
          else
            git commit -m "Manifest güncellemesi - $(date -u +'%Y-%m-%d')"
            git push
          fi
